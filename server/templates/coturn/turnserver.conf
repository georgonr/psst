# coturn — TURN server pre hovory zo sietí, ktoré blokujú UDP (./deploy.sh → data/config/coturn/turnserver.conf)
# Beží v host sieti (network_mode: host): relay sokety musia byť na skutočnej IP servera, aby ich SFU
# (LiveKit, node_ip = IP servera) dosiahla — v Docker bridge sieti by relay → SFU nefungoval.
#   TURN/UDP  : verejne <IP>:3478/udp
#   TURN/TLS  : turns:__TURN_DOMAIN__:443 → nginx (SNI, ukončí TLS) → TCP __DOCKER_GW__:3478 sem
realm=__TURN_DOMAIN__
server-name=__TURN_DOMAIN__
listening-port=3478
__TURN_LISTEN_LINES__
# dočasné prihlasovacie údaje generuje LiveKit z tohto tajomstva (TURN REST API)
use-auth-secret
static-auth-secret=__TURN_SECRET__
fingerprint
# relay porty komunikujú len s vlastnou SFU na tom istom serveri — netreba ich otvárať vo firewalle
min-port=49160
max-port=49260
# NIE otvorený relay: povolené je len preposielanie na SFU tohto servera
no-multicast-peers
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
__TURN_ALLOWED_PEER_LINES__
no-tls
no-dtls
no-cli
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
total-quota=200
user-quota=12
stale-nonce=600
log-file=stdout
simple-log
