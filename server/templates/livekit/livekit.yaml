# LiveKit SFU — šablóna (./deploy.sh → data/config/livekit/livekit.yaml)
port: 7880
logging:
  level: info
rtc:
  # ICE/TCP fallback (keď UDP nie je dostupné)
  tcp_port: 7881
  # všetko UDP médium cez jeden port (UDP mux) → vo firewalle stačí 7882/udp
  udp_port: 7882
  use_external_ip: __LIVEKIT_USE_EXTERNAL_IP__
__LIVEKIT_NODE_IP_LINE__
  # TURN pre siete bez UDP: len TLS na 443 (nginx SNI+ALPN → coturn). TURN/UDP 3478 sa nepublikuje
  # (firewall povoľuje len 22, 80, 443, 7881/tcp, 7882/udp — DECISIONS D42).
  turn_servers:
    - host: __TURN_DOMAIN__
      port: 443
      protocol: tls
      secret: __TURN_SECRET__
      ttl: 14400
keys:
  __LIVEKIT_API_KEY__: __LIVEKIT_API_SECRET__
room:
  # miestnosti vytvára len lk-jwt-service (pre používateľov z __SERVER_NAME__)
  auto_create: false
webhook:
  api_key: __LIVEKIT_API_KEY__
  urls:
    - http://lk-jwt-service:8080/sfu_webhook
# Vstavaný TURN LiveKit je vypnutý — TURN zabezpečuje coturn (host sieť, viď templates/coturn).
# Klienti dostanú dočasné prihlasovacie údaje (TURN REST API, zdieľané tajomstvo s coturn).
turn:
  enabled: false
