# PSST nginx — šablóna (./deploy.sh → data/config/nginx/psst.conf)
# Domény: __MATRIX_DOMAIN__ (Synapse + .well-known + LiveKit + Sygnal), __APP_DOMAIN__ (PSST web + právne stránky),
#         __CALL_DOMAIN__ (Element Call + TURN/TLS), __AUTH_DOMAIN__ (MAS); __WEB_DOMAIN__ = Matrix server_name
#         __SERVER_NAME__ (úvodná stránka + .well-known, www.conf). Iné názvy nedostanú nič (D85).
# HTTPS servery počúvajú na 127.0.0.1:8443 (PROXY protocol) — verejný :443 je stream v nginx.conf.

# Docker DNS — upstreamy sa resolvujú lenivo, nginx naštartuje aj keď niektorý kontajner práve reštartuje.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server_tokens off;
client_max_body_size 100M;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Spoločné TLS nastavenia (jeden SAN certifikát "psst" pre všetky domény)
ssl_certificate     /etc/letsencrypt/live/psst/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/psst/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
# Mozilla intermediate (TLS 1.2 len ECDHE + AEAD; TLS 1.3 má vlastné sady)
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# ---------------------------------------------------------------- HTTP :80
# Neznáme názvy (napr. bývalé domény, ktorých DNS ešte ukazuje sem) nedostanú ani presmerovanie (D85).
server {
    listen 80 default_server;
    server_name _;

    # interný healthcheck kontajnera
    location = /nginx-health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / { return 444; }
}
server {
    listen 80;
    server_name __ALL_DOMAINS__;

    # ACME HTTP-01 (certbot --webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------- HTTPS :443 default (neznámy Host)
# Neznámy SNI: TLS handshake sa odmietne (žiadny certifikát, žiadny obsah); bez SNI: 444.
server {
    listen 127.0.0.1:8443 ssl proxy_protocol default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# --------------------------------------------------------- __MATRIX_DOMAIN__
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name __MATRIX_DOMAIN__;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- .well-known (hlavná kópia je na server_name __SERVER_NAME__, www.conf; tu pre klientov, ktorí sa
    #     pýtajú priamo homeservera) ---
    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization" always;
        add_header Cache-Control "public, max-age=3600" always;
        if ($request_method = OPTIONS) { return 204; }
        return 200 '{"m.homeserver":{"base_url":"https://__MATRIX_DOMAIN__"},"org.matrix.msc4143.rtc_foci":[{"type":"livekit","livekit_service_url":"https://__MATRIX_DOMAIN__/livekit/jwt"}]}';
    }
    location = /.well-known/matrix/server { return 404; }

    # --- federácia / key API zvonka nikdy ---
    location ^~ /_matrix/federation/ { return 404; }
    location ^~ /_matrix/key/        { return 404; }

    # --- admin API nie je dostupné z internetu (len cez SSH tunel na 127.0.0.1:8008) ---
    location ^~ /_synapse/admin { return 404; }

    # --- MAS: prihlásenie/odhlásenie/obnova tokenu cez Matrix C-S API (compat) ---
    location ~ ^/_matrix/client/[^/]+/(login|logout|refresh)$ {
        set $mas http://mas:8080;
        # MAS môže bežať s prefixom (AUTH_PREFIX) — compat API je potom pod __AUTH_PREFIX__/_matrix/…
        rewrite ^ __AUTH_PREFIX__$uri break;
        proxy_pass $mas;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }

    # >>> MAS_PATH (deploy.sh odstráni, ak MAS beží na vlastnej subdoméne)
    # --- MAS (prihlásenie, registrácia, správa účtu) na ceste __AUTH_PREFIX__/ ---
    location ^~ __AUTH_PREFIX__/ {
        set $mas http://mas:8080;
        proxy_pass $mas;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;   # prihlasovacia stránka sa neindexuje (D82)
    }
    # <<< MAS_PATH

    # --- iOS push (APNs) cez self-hosted Sygnal — beží len ak je nahraný APNs kľúč ---
    location = /_matrix/push/v1/notify {
        set $sygnal http://sygnal:5000;
        proxy_pass $sygnal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- žiadosť o overenie zariadenia: ide do Synapse a kópia do psst-wake, ktorý pošle telefónom toho istého
    #     používateľa budíček cez Sygnal (to-device správy sa inak nepushujú) — DECISIONS D68 ---
    location ~ ^/_matrix/client/[^/]+/sendToDevice/m\.key\.verification\.request/ {
        mirror /_psst_verify_wake;
        mirror_request_body on;
        set $synapse http://synapse:8008;
        proxy_pass $synapse;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        client_max_body_size 1M;
    }
    location = /_psst_verify_wake {
        internal;
        set $psst_wake http://psst-wake:8080;
        proxy_pass $psst_wake$request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # --- Synapse client API ---
    location ~ ^(/_matrix|/_synapse/client) {
        set $synapse http://synapse:8008;
        proxy_pass $synapse;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        client_max_body_size 100M;
    }

    # --- MatrixRTC autorizačná služba (lk-jwt-service) ---
    location ^~ /livekit/jwt/ {
        set $lkjwt http://lk-jwt-service:8080;
        rewrite ^/livekit/jwt/(.*)$ /$1 break;
        proxy_pass $lkjwt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- LiveKit SFU signalizácia (WebSocket) + RoomService (Twirp) ---
    location ^~ /livekit/sfu/ {
        set $livekit http://livekit:7880;
        rewrite ^/livekit/sfu/(.*)$ /$1 break;
        proxy_pass $livekit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding gzip;
        proxy_buffering off;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = / { return 302 https://__APP_DOMAIN__/; }
    # vyhľadávače: nič z tejto domény neindexovať (D82)
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location / { return 404; }
}

# ------------------------------------- __MATRIX_DOMAIN__:8448 — LEN interná sieť
# Port 8448 NIE JE publikovaný na hostiteľa (ani povolený v UFW). lk-jwt-service overuje OpenID tokeny (legacy
# endpointy /sfu/get a /get_token): server_name __SERVER_NAME__ → https://__SERVER_NAME__/.well-known/matrix/server
# → __MATRIX_DOMAIN__:8448/_matrix/federation/v1/openid/userinfo. V Docker sieti sú obe mená alias tohto nginxu.
# Nič iné z federačného API sa neposkytuje; zvonka je 8448 zatvorený, takže federácia nefunguje.
server {
    listen 8448 ssl;
    server_name __MATRIX_DOMAIN__ __SERVER_NAME__;

    location = /_matrix/federation/v1/openid/userinfo {
        set $synapse_openid http://synapse:8009;
        proxy_pass $synapse_openid;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}

# ------------------------------------------------------------ __APP_DOMAIN__
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name __APP_DOMAIN__;

    root /srv/app;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    # Element Web má vlastnú CSP v <meta> v index.html; tu len zakážeme vkladanie do cudzích stránok.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # Stránka na stiahnutie appiek (D59) — generuje scripts/downloads.py, súbory majú jedinečné mená
    location = /download { return 301 https://$host/download/; }   # absolútne: nginx za stream proxy by inak pridal interný port 8443
    location ^~ /download/ {
        alias /srv/downloads/;
        index index.html;
        types {
            text/html html; application/json json;
            application/vnd.android.package-archive apk; application/x-msi msi; application/x-apple-diskimage dmg;
        }
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        location ^~ /download/files/ {
            alias /srv/downloads/files/;
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    # vyhľadávače (D82): indexovať smie len stránka na stiahnutie a právne texty; web app (prihlásenie)
    # a /admin majú navyše X-Robots-Tag noindex
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "User-agent: *\nAllow: /download/\nDisallow: /\n";
    }

    # Administrácia pozvánok a členov (server/admin, D56) — vlastné bezpečnostné hlavičky posiela appka
    location ^~ /admin {
        set $psst_admin http://admin:8000;
        proxy_pass $psst_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        client_max_body_size 16k;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Podmienky a Súkromie sú od D87 na https://__SERVER_NAME__/terms a /privacy (server/www/legal.py);
    # staré adresy (odkazy v starších buildoch appiek a v MAS) presmeruje
    location ~ ^/(terms|privacy)\.html$ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 301 https://__SERVER_NAME__/$1;
    }
    location = /delete-account { return 301 https://__SERVER_NAME__/delete-account; }

    # App Links (Android) / Universal Links (iOS) pre eu.macet.psst — generuje deploy.sh
    location ^~ /.well-known/ {
        root /srv/app-default;
        default_type application/json;
        add_header Cache-Control "max-age=3600" always;
        try_files $uri =404;
    }

    # Web push (D76): verejný VAPID kľúč + app_id pushera pre psst web — generuje deploy.sh
    location = /psst-push.json {
        root /srv/app-default;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /psst-push.json =404;
    }

    # config.json: z distribúcie, ak tam je; inak serverový default (data/config/app-default)
    location = /config.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files /config.json @default_config;
    }
    location @default_config {
        root /srv/app-default;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /config.json =404;
    }

    # súbory, ktoré sa musia vždy revalidovať
    location ~ ^/(index\.html|version|config\..+\.json|sw\.js|manifest\.json)?$ {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;   # web app = prihlasovacia stránka (D82)
        try_files $uri /index.html =404;
    }
    location ~ ^/(i18n|home|sites)/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    # hashované bundly → dlhodobá cache
    location ^~ /bundles/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    # embedded Element Call (a ďalšie widgety) — žiadny SPA fallback: chýbajúci súbor (napr. voliteľný
    # widgets/element-call/config.json) musí vrátiť 404, inak widget dostane index.html namiesto JSON
    # a hovor zostane visieť na "Loading…".
    location ^~ /widgets/ {
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

# ----------------------------------------------------------- __CALL_DOMAIN__
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name __CALL_DOMAIN__;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://__APP_DOMAIN__" always;

    location / {
        set $ec http://element-call:8080;
        proxy_pass $ec;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# >>> AUTH_VHOST (deploy.sh odstráni, ak MAS beží na ceste domény __MATRIX_DOMAIN__)
# ------------------------------------------------------------ __AUTH_DOMAIN__ (MAS)
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name __AUTH_DOMAIN__;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        set $mas http://mas:8080;
        proxy_pass $mas;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}
# <<< AUTH_VHOST
