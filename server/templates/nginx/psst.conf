# PSST nginx — šablóna (./deploy.sh → data/config/nginx/psst.conf)
# Domény: __MATRIX_DOMAIN__ (Synapse + .well-known + LiveKit), __APP_DOMAIN__ (PSST web), __CALL_DOMAIN__ (Element Call)

# Docker DNS — upstreamy sa resolvujú lenivo, nginx naštartuje aj keď niektorý kontajner práve reštartuje.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server_tokens off;
client_max_body_size 100M;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Spoločné TLS nastavenia (jeden SAN certifikát "psst" pre všetky tri domény)
ssl_certificate     /etc/letsencrypt/live/psst/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/psst/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# ---------------------------------------------------------------- HTTP :80
server {
    listen 80 default_server;
    server_name _;

    # ACME HTTP-01 (certbot --webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # interný healthcheck kontajnera
    location = /nginx-health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------- HTTPS :443 default (neznámy Host)
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    return 444;
}

# --------------------------------------------------------- __MATRIX_DOMAIN__
server {
    listen 443 ssl;
    http2 on;
    server_name __MATRIX_DOMAIN__;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- .well-known delegácia (server_name = __MATRIX_DOMAIN__, takže je priamo tu) ---
    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization" always;
        add_header Cache-Control "public, max-age=3600" always;
        if ($request_method = OPTIONS) { return 204; }
        return 200 '{"m.homeserver":{"base_url":"https://__MATRIX_DOMAIN__"},"org.matrix.msc4143.rtc_foci":[{"type":"livekit","livekit_service_url":"https://__MATRIX_DOMAIN__/livekit/jwt"}]}';
    }
    # federácia je vypnutá → m.server sa zámerne neposkytuje
    location = /.well-known/matrix/server { return 404; }

    # --- federácia / key API zvonka nikdy ---
    location ^~ /_matrix/federation/ { return 404; }
    location ^~ /_matrix/key/        { return 404; }

    # --- admin API nie je dostupné z internetu (len cez SSH tunel na 127.0.0.1:8008) ---
    location ^~ /_synapse/admin { return 404; }

    # --- Synapse client API ---
    location ~ ^(/_matrix|/_synapse/client) {
        set $synapse http://synapse:8008;
        proxy_pass $synapse;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        client_max_body_size 100M;
    }

    # --- MatrixRTC autorizačná služba (lk-jwt-service) ---
    location ^~ /livekit/jwt/ {
        set $lkjwt http://lk-jwt-service:8080;
        rewrite ^/livekit/jwt/(.*)$ /$1 break;
        proxy_pass $lkjwt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- LiveKit SFU signalizácia (WebSocket) + RoomService (Twirp) ---
    location ^~ /livekit/sfu/ {
        set $livekit http://livekit:7880;
        rewrite ^/livekit/sfu/(.*)$ /$1 break;
        proxy_pass $livekit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding gzip;
        proxy_buffering off;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = / { return 302 https://__APP_DOMAIN__/; }
    location / { return 404; }
}

# ------------------------------------- __MATRIX_DOMAIN__:8448 — LEN interná sieť
# Port 8448 NIE JE publikovaný na hostiteľa. lk-jwt-service overuje OpenID tokeny (legacy endpointy
# /sfu/get a /get_token) cez https://__MATRIX_DOMAIN__:8448/_matrix/federation/v1/openid/userinfo;
# v Docker sieti je __MATRIX_DOMAIN__ alias tohto nginxu. Nič iné z federačného API sa neposkytuje.
server {
    listen 8448 ssl;
    server_name __MATRIX_DOMAIN__;

    location = /_matrix/federation/v1/openid/userinfo {
        set $synapse_openid http://synapse:8009;
        proxy_pass $synapse_openid;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}

# ------------------------------------------------------------ __APP_DOMAIN__
server {
    listen 443 ssl;
    http2 on;
    server_name __APP_DOMAIN__;

    root /srv/app;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    # Element Web má vlastnú CSP v <meta> v index.html; tu len zakážeme vkladanie do cudzích stránok.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # App Links (Android) / Universal Links (iOS) pre eu.macet.psst — generuje deploy.sh
    location ^~ /.well-known/ {
        root /srv/app-default;
        default_type application/json;
        add_header Cache-Control "max-age=3600" always;
        try_files $uri =404;
    }

    # config.json: z distribúcie, ak tam je; inak serverový default (data/config/app-default)
    location = /config.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files /config.json @default_config;
    }
    location @default_config {
        root /srv/app-default;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /config.json =404;
    }

    # súbory, ktoré sa musia vždy revalidovať
    location ~ ^/(index\.html|version|config\..+\.json|sw\.js|manifest\.json)?$ {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files $uri /index.html =404;
    }
    location ~ ^/(i18n|home|sites)/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    # hashované bundly → dlhodobá cache
    location ^~ /bundles/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

# ----------------------------------------------------------- __CALL_DOMAIN__
server {
    listen 443 ssl;
    http2 on;
    server_name __CALL_DOMAIN__;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://__APP_DOMAIN__" always;

    location / {
        set $ec http://element-call:8080;
        proxy_pass $ec;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
