# PSST nginx — hlavná konfigurácia (./deploy.sh → data/config/nginx-main/nginx.conf)
# Port 443 obsluhuje modul stream: podľa SNI pošle
#   __TURN_DOMAIN__ bez HTTP ALPN → TURN/TLS (ukončenie TLS tu, ďalej TURN-over-TCP na coturn)
#   všetko ostatné   → interný HTTPS server 127.0.0.1:8443 (PROXY protocol zachová IP klienta)
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events { worker_connections 4096; }

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    log_format psst_stream '$remote_addr [$time_local] $ssl_preread_server_name $status $bytes_sent $bytes_received $session_time';
    access_log /var/log/nginx/stream.log psst_stream;

    # TURN/TLS sa rozlíši podľa SNI __TURN_DOMAIN__ A zároveň ALPN: prehliadače (HTTPS) posielajú
    # h2/http/1.1, TURN klient WebRTC ALPN neposiela (alebo len c-webrtc). Vďaka tomu môže TURN
    # zdieľať doménu s Element Call (DECISIONS D42) — HTTPS na tú istú doménu ide ďalej na 8443.
    map "$ssl_preread_server_name|$ssl_preread_alpn_protocols" $psst_443_upstream {
        "~^__TURN_DOMAIN_RE__\|(?!.*(h2|http/1))"  127.0.0.1:5349;
        default                                       127.0.0.1:8443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $psst_443_upstream;
        proxy_protocol on;
        proxy_connect_timeout 5s;
    }

    # TURN/TLS: tu sa ukončí TLS, ďalej TURN-over-TCP na coturn (host sieť, brána Docker siete)
    server {
        listen 127.0.0.1:5349 ssl proxy_protocol;
        set_real_ip_from 127.0.0.1;
        ssl_certificate     /etc/letsencrypt/live/psst/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/psst/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        proxy_pass __DOCKER_GW__:3478;
        proxy_timeout 1h;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;
    # skutočná IP klienta z PROXY protocol (stream → 127.0.0.1:8443)
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    include /etc/nginx/conf.d/*.conf;
}
