# ------------------------------------------------------------ __WEB_DOMAIN__ (D82, D85)
# Úvodná stránka (server/www) a zároveň Matrix server_name __SERVER_NAME__: .well-known/matrix/{client,server}
# ukazujú na homeserver __MATRIX_DOMAIN__. Spoločný certifikát "psst" (všetky domény v jednom SAN certifikáte).
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name __WEB_DOMAIN__;

    # obsah: server/www → data/config/app-default/www (už pripojený adresár, nový mount by vyžadoval
    # znovuvytvorenie kontajnera nginx = výpadok všetkých služieb)
    root /srv/app-default/www;
    index index.html;
    charset utf-8;
    etag on;

    # rovnaký štandard ako app/chat + prísne CSP: nič mimo vlastnej domény, žiadne inline skripty
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;

    # --- Matrix: server_name __SERVER_NAME__ → homeserver __MATRIX_DOMAIN__ (D85) ---
    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        if ($request_method = OPTIONS) { return 204; }
        return 200 '{"m.homeserver":{"base_url":"https://__MATRIX_DOMAIN__"},"org.matrix.msc4143.rtc_foci":[{"type":"livekit","livekit_service_url":"https://__MATRIX_DOMAIN__/livekit/jwt"}]}';
    }
    # m.server: port 8448 je zvonka zatvorený (federácia vypnutá); v Docker sieti ho používa lk-jwt-service
    # na overenie OpenID tokenov (psst.conf, vhost :8448)
    location = /.well-known/matrix/server {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 200 '{"m.server":"__MATRIX_DOMAIN__:8448"}';
    }

    location = /sk { return 301 https://$host/sk/; }
    location = /en { return 301 https://$host/en/; }

    location ^~ /assets/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Play Console: videá k vyhláseniam (služby v popredí, hovor na celú obrazovku) — D87. Vlastná CSP, aby sa video
    # dalo prehrať priamo v prehliadači (media dokument).
    location ^~ /video/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; media-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }

    # /privacy, /terms, /delete-account (D87) → privacy.html …; /privacy.html presmeruje na tvar bez prípony
    location ~ ^/(privacy|terms|delete-account)\.html$ { return 301 /$1; }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}

# ------------------------------------------------------------ __WWW_DOMAIN__ → __WEB_DOMAIN__
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name __WWW_DOMAIN__;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 301 https://__WEB_DOMAIN__$request_uri;
}
