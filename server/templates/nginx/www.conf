# ------------------------------------------------------------ __WEB_DOMAIN__ (D82)
# Statická prezentačná stránka (server/www). Vlastný certifikát "psst-web" — zdieľaný certifikát "psst"
# pre app/chat/call/push sa kvôli nej nemení. deploy.sh tento súbor vyrenderuje, až keď certifikát existuje.
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name __WEB_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/psst-web/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psst-web/privkey.pem;

    # obsah: server/www → data/config/app-default/www (už pripojený adresár, nový mount by vyžadoval
    # znovuvytvorenie kontajnera nginx = výpadok všetkých služieb)
    root /srv/app-default/www;
    index index.html;
    charset utf-8;
    etag on;

    # rovnaký štandard ako app/chat + prísne CSP: nič mimo vlastnej domény, žiadne inline skripty
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;

    location = /sk { return 301 https://$host/sk/; }
    location = /en { return 301 https://$host/en/; }

    location ^~ /assets/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
