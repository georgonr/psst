# PSST — Synapse konfigurácia (šablóna; ./deploy.sh ju vyrenderuje do data/config/synapse/homeserver.yaml).
# Zástupné symboly (meno v dvojitých podčiarkovníkoch) sa nahradia hodnotami zo server/.env.
# Dokumentácia: https://element-hq.github.io/synapse/latest/usage/configuration/config_documentation.html

server_name: "__MATRIX_DOMAIN__"
public_baseurl: "https://__MATRIX_DOMAIN__/"
pid_file: /data/homeserver.pid
report_stats: false
enable_metrics: false

listeners:
  # Client API (+ /_synapse/client). Kontajner je publikovaný len na 127.0.0.1:8008 hostiteľa;
  # verejný prístup ide výhradne cez nginx. ŽIADNY "federation" resource → federácia nebeží.
  - port: 8008
    type: http
    tls: false
    x_forwarded: true
    bind_addresses: ["0.0.0.0"]
    resources:
      - names: [client]
        compress: false
  # Len OpenID userinfo (/_matrix/federation/v1/openid/userinfo) pre lk-jwt-service (MatrixRTC).
  # Nie je publikovaný na hostiteľa; dostupný iba z internej Docker siete cez nginx:8448.
  - port: 8009
    type: http
    tls: false
    x_forwarded: true
    bind_addresses: ["0.0.0.0"]
    resources:
      - names: [openid]
        compress: false

database:
  name: psycopg2
  args:
    user: synapse
    password: "__POSTGRES_PASSWORD__"
    dbname: synapse
    host: postgres
    port: 5432
    cp_min: 5
    cp_max: 10

log_config: "/config/log.config"
media_store_path: /data/media_store
signing_key_path: "/data/__MATRIX_DOMAIN__.signing.key"
max_upload_size: 100M

# --- Federácia vypnutá ---
federation_domain_whitelist: []
trusted_key_servers: []
suppress_key_server_warning: true
allow_public_rooms_over_federation: false
serve_server_wellknown: false

# --- Kanály: adresár miestností je viditeľný len prihláseným PSST používateľom ---
# Bez federácie a s registráciou len cez tokeny je "verejná" miestnosť = kanál servera.
allow_public_rooms_without_auth: false
room_list_publication_rules:
  - action: allow

# --- Účty, prihlásenie a registrácia: Matrix Authentication Service (MAS, __MAS_PUBLIC_BASE__) ---
# Registrácia prebieha v MAS (aj z Element X), výhradne s pozývacím tokenom (scripts/members.sh invite).
enable_registration: false
password_config:
  enabled: false
allow_guest_access: false
matrix_authentication_service:
  enabled: true
  endpoint: http://mas:8080__AUTH_PREFIX__/
  secret_path: /config/mas_shared_secret
macaroon_secret_key: "__SYNAPSE_MACAROON_SECRET_KEY__"
form_secret: "__SYNAPSE_FORM_SECRET__"
# bez e-mailu, captchy a 3PID
enable_3pid_lookup: false
enable_set_displayname: true
enable_set_avatar_url: true

# --- Súkromie ---
presence:
  enabled: false
url_preview_enabled: false
require_auth_for_profile_requests: true
limit_profile_requests_to_users_who_share_rooms: true
allow_public_rooms_without_auth: false
user_directory:
  enabled: true
  search_all_users: false
# Všetky nové miestnosti (aj skupinové) sú šifrované end-to-end.
encryption_enabled_by_default_for_room_type: all

# --- MatrixRTC / Element Call ---
experimental_features:
  # MSC4143: aktivuje aj nestabilný /_matrix/client/unstable/org.matrix.msc4143/rtc/transports (MSC4519)
  msc4143_enabled: true
  # MSC4502 + MSC4512: lk-jwt-service ako application service (overenie členstva, proxy /rtc/livekit)
  msc4502_enabled: true
  msc4512_enabled: true
  # Prihlásenie nového zariadenia QR kódom (D58): MSC4108 (verzia 2024) aj MSC4388 (bezpečný kanál, novšie klienty).
  # "open" = rendezvous môže založiť aj ešte neprihlásené zariadenie (nové zariadenie ukazuje QR); dáta sú krátkodobé,
  # šifrované medzi zariadeniami a obmedzené rate limitom Synapse. Vyžaduje MAS (device code grant).
  msc4108_enabled: true
  msc4388_mode: open
  # MSC3266 (room summary) a MSC4222 (state_after) sú v Synapse >= 1.165 stabilné → bez flagu.

# MSC4140 delayed events (stabilná voľba)
max_event_delay_duration: 24h

# --- Hovory: každý člen miestnosti sa môže pripojiť do skupinového hovoru ---
# Element Web to nastavuje sám, ale miestnosti od iných klientov/botov by mali členstvo v hovore len pre
# moderátorov ("You do not have permission to start video calls"). Synapse defaulty (DEFAULT_EVENTS_POWER_LEVEL)
# sú zachované; pridané sú len stavové udalosti členstva v MatrixRTC hovore.
default_power_level_content_override:
  private_chat:
    events:
      m.room.avatar: 50
      m.room.canonical_alias: 50
      m.room.encryption: 100
      m.room.history_visibility: 100
      m.room.name: 50
      m.room.power_levels: 100
      m.room.server_acl: 100
      m.room.tombstone: 100
      org.matrix.msc3401.call.member: 0
      m.rtc.member: 0
  trusted_private_chat:
    events:
      m.room.avatar: 50
      m.room.canonical_alias: 50
      m.room.encryption: 100
      m.room.history_visibility: 100
      m.room.name: 50
      m.room.power_levels: 100
      m.room.server_acl: 100
      m.room.tombstone: 100
      org.matrix.msc3401.call.member: 0
      m.rtc.member: 0
  public_chat:
    events:
      m.room.avatar: 50
      m.room.canonical_alias: 50
      m.room.encryption: 100
      m.room.history_visibility: 100
      m.room.name: 50
      m.room.power_levels: 100
      m.room.server_acl: 100
      m.room.tombstone: 100
      org.matrix.msc3401.call.member: 0
      m.rtc.member: 0

matrix_rtc:
  transports:
    # stabilný transport: klient si token vypýta cez C-S API (/_matrix/client/v1/rtc/livekit/get_token),
    # Synapse požiadavku preposiela lk-jwt-service (MSC4512 proxy).
    - type: m.livekit
      url: "wss://__MATRIX_DOMAIN__/livekit/sfu"
    # starší (nestabilný) transport pre klientov, ktorí ešte poznajú len livekit_service_url
    - type: livekit
      url: "wss://__MATRIX_DOMAIN__/livekit/sfu"
      livekit_service_url: "https://__MATRIX_DOMAIN__/livekit/jwt"

app_service_config_files:
  - /config/lk-jwt-appservice.yaml

# Rate limity podľa Element Call self-hosting návodu
rc_message:
  per_second: 0.5
  burst_count: 30
rc_delayed_event_mgmt:
  per_second: 1
  burst_count: 20

# --- Push notifikácie (vlastné brány: ntfy pre Android/UnifiedPush, Sygnal pre iOS/APNs) ---
# Obsah správ do push brán neposielame (len event_id; appka si správu stiahne a dešifruje sama).
push:
  include_content: false
# Push brány bežia na tomto serveri za nginx (pevná IP v Docker sieti). Synapse inak blokuje
# súkromné rozsahy (ip_range_blacklist) — povolená je len táto jedna adresa.
ip_range_whitelist:
  - __NGINX_IP__

