# Matrix Authentication Service (MAS) — šablóna (./deploy.sh → data/config/mas/config.yaml)
# MAS spravuje účty, prihlásenie a registráciu (OIDC) pre __SERVER_NAME__ (homeserver __MATRIX_DOMAIN__).
# Registrácia (D88): otvorená, heslom, bez e-mailu a bez pozývacieho kódu; chráni ju hCaptcha, prísny limit na IP
# a povinný súhlas s Podmienkami (branding.tos_uri) vrátane potvrdenia veku 18+ (text políčka: scripts/mas-assets.py).
http:
  # bez vlastnej subdomény: MAS na ceste __AUTH_PREFIX__ domény __AUTH_DOMAIN__ (DECISIONS D42)
  public_base: __MAS_PUBLIC_BASE__
  issuer: __MAS_PUBLIC_BASE__
  # požiadavky prichádzajú len cez nginx v Docker sieti
  trusted_proxies: [172.30.0.0/24, 127.0.0.0/8]
  listeners:
    - name: web
      prefix: "__AUTH_PREFIX__"   # deploy.sh riadok zmaže, ak je AUTH_PREFIX prázdny
      resources:
        - name: discovery
        - name: human
        - name: oauth
        - name: compat
        - name: graphql
        - name: assets
      binds:
        - address: "0.0.0.0:8080"
    - name: internal
      resources:
        - name: health
        - name: adminapi
      binds:
        - address: "0.0.0.0:8081"

database:
  uri: postgresql://synapse:__POSTGRES_PASSWORD__@postgres/mas

matrix:
  kind: synapse
  homeserver: __SERVER_NAME__
  secret_file: /secrets/mas_shared_secret
  endpoint: http://synapse:8008/

secrets:
  encryption_file: /secrets/encryption
  keys:
    - kid: psst-rsa
      key_file: /secrets/rsa.pem
    - kid: psst-ec
      key_file: /secrets/ec.pem

passwords:
  enabled: true
  schemes:
    - version: 1
      algorithm: argon2id
  minimum_complexity: 3

account:
  password_registration_enabled: true
  password_registration_email_required: false
  password_registration_token_required: false
  password_recovery_enabled: false
  email_change_allowed: true
  displayname_change_allowed: true
  password_change_allowed: true
  account_deactivation_allowed: true
  login_with_email_allowed: false

# Bez e-mailového servera (registrácia ani obnova hesla e-mail nevyžadujú)
email:
  from: '"psst" <noreply@__AUTH_DOMAIN__>'
  reply_to: '"psst" <noreply@__AUTH_DOMAIN__>'
  transport: blackhole

# hCaptcha (D88): site_key je verejný, secret_key len zo server/secrets/mas/hcaptcha_secret (deploy.sh), nie z gitu.
# MAS overí token na serveri (api.hcaptcha.com/siteverify) — registrácia bez platného tokenu sa odmietne.
captcha:
  service: hcaptcha
  site_key: "__HCAPTCHA_SITE_KEY__"
  secret_key: "__HCAPTCHA_SECRET__"

# Limity (D88; názvy podľa dokumentácie MAS 1.29). Registrácia: 3 naraz z jednej IP, potom 1 za ~21 min.
rate_limiting:
  registration:
    burst: 3
    per_second: 0.0008
  login:
    per_ip:
      burst: 3
      per_second: 0.05
    per_account:
      burst: 1800
      per_second: 0.5
  username_availability:
    burst: 5
    per_second: 1.0

# Administračná stránka https://__APP_DOMAIN__/admin (server/admin, DECISIONS D56):
# prihlásenie admina (authorization code + PKCE) a prístup k admin API (client_credentials, urn:mas:admin)
clients:
  - client_id: __ADMIN_CLIENT_ID__
    client_auth_method: client_secret_basic
    client_secret: "__ADMIN_CLIENT_SECRET__"
    redirect_uris:
      - https://__APP_DOMAIN__/admin/callback

policy:
  data:
    admin_clients:
      - __ADMIN_CLIENT_ID__
    client_registration:
      # Element X / Web / Desktop sa registrujú dynamicky; metadáta (client_uri, tos, policy) sú
      # na app doméne, redirect schémy appiek (eu.macet.psst, pro.psst.app) → povoliť rozdielny host
      allow_host_mismatch: true
      allow_insecure_uris: false
      allow_missing_client_uri: false
    registration:
      banned_usernames:
        literals: [admin, administrator, root, psst, psstadmin, support, moderator, system, matrix, synapse]

branding:
  service_name: psst
  policy_uri: https://__SERVER_NAME__/privacy
  tos_uri: https://__SERVER_NAME__/terms

telemetry:
  tracing:
    exporter: none
  metrics:
    exporter: none
  sentry:
    dsn: ~
