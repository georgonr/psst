# PSST server stack — Synapse + PostgreSQL + LiveKit SFU + lk-jwt-service + Element Call + nginx + certbot.
# Spúšťa sa cez ./deploy.sh (vygeneruje .env, konfigurácie do data/config a certifikáty).
# Všetky dáta sú v server/data/ (migrácia = skopírovať adresár server/).

name: psst

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: docker.io/library/postgres:18.7-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./deploy.sh first}
      # Synapse vyžaduje C collation / ctype
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [psst]

  synapse:
    image: ghcr.io/element-hq/synapse:v1.165.0
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    command: ["run", "--config-path", "/config/homeserver.yaml"]
    volumes:
      - ./data/config/synapse:/config:ro
      - ./data/synapse:/data
    # Client API len na loopback hostiteľa (admin API cez SSH tunel). Verejne ide všetko cez nginx.
    ports:
      - "127.0.0.1:8008:8008"
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    networks: [psst]

  livekit:
    image: docker.io/livekit/livekit-server:v1.13.11
    restart: unless-stopped
    logging: *logging
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./data/config/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # WebRTC média: ICE/TCP fallback + UDP mux. Signalizácia (7880) ide len cez nginx.
      - "0.0.0.0:7881:7881/tcp"
      - "0.0.0.0:7882:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [psst]

  lk-jwt-service:
    image: ghcr.io/element-hq/lk-jwt-service:0.10.0
    restart: unless-stopped
    logging: *logging
    depends_on:
      synapse:
        condition: service_started
      livekit:
        condition: service_started
    environment:
      # Verejná URL SFU — vracia sa klientom a cez ňu (nginx) služba volá aj LiveKit RoomService API.
      LIVEKIT_URL: wss://${MATRIX_DOMAIN}/livekit/sfu
      LIVEKIT_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_JWT_BIND: ":8080"
      LIVEKIT_FULL_ACCESS_HOMESERVERS: ${MATRIX_DOMAIN}
      # federácia je vypnutá → nikto zvonka nesmie publikovať na našom SFU
      LIVEKIT_REMOTE_CAN_PUBLISH_HOMESERVERS: ""
      LIVEKIT_AS_REGISTRATION_FILE: /config/lk-jwt-appservice.yaml
      LIVEKIT_HS_SERVER_NAME: ${MATRIX_DOMAIN}
      LIVEKIT_CS_API_URL_OVERRIDES: ${MATRIX_DOMAIN}=http://synapse:8008
      LIVEKIT_SANITY_CHECK_INTERVAL_SECONDS: "60"
    volumes:
      - ./data/config/synapse/lk-jwt-appservice.yaml:/config/lk-jwt-appservice.yaml:ro
    healthcheck:
      test: ["CMD", "/lk-jwt-service-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [psst]

  element-call:
    image: ghcr.io/element-hq/element-call:v0.28.2
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./data/config/element-call/config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [psst]

  # coturn — TURN pre siete bez UDP (UDP 3478 verejne; TLS 443 cez nginx). Host sieť je nutná: relay
  # sokety musia byť na skutočnej IP servera, aby k nim mala prístup SFU (LiveKit, node_ip).
  coturn:
    image: docker.io/coturn/coturn:4.18.0
    restart: unless-stopped
    logging: *logging
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./data/config/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    depends_on:
      - nginx

  # Matrix Authentication Service — účty, prihlásenie, registrácia (len s pozývacím tokenom)
  mas:
    image: ghcr.io/element-hq/matrix-authentication-service:1.29.0
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    command: ["server", "--config", "/config/config.yaml"]
    volumes:
      - ./data/config/mas/config.yaml:/config/config.yaml:ro
      - ./secrets/mas:/secrets:ro
    ports:
      # admin API + health len na loopback hostiteľa (scripts/members.sh, healthcheck.sh)
      - "127.0.0.1:8081:8081"
    networks: [psst]

  # Sygnal — vlastná Matrix push brána: Android cez FCM HTTP v1 (Firebase projekt psst-macet), iOS cez APNs.
  # Spúšťa sa s profilom "sygnal" (deploy.sh ho zapne, keď nájde secrets/fcm/service-account.json
  # a/alebo secrets/apns/AuthKey_<KEY_ID>.p8). Zvonka dostupný len cez nginx: https://chat…/_matrix/push/v1/notify
  # (./deploy.sh ho zapne, keď nájde secrets/apns/AuthKey_<KEY_ID>.p8).
  sygnal:
    image: docker.io/matrixdotorg/sygnal:v0.15.1
    profiles: ["sygnal"]
    restart: unless-stopped
    logging: *logging
    environment:
      SYGNAL_CONF: /config/sygnal.yaml
    volumes:
      - ./data/config/sygnal/sygnal.yaml:/config/sygnal.yaml:ro
      - ./secrets/apns:/apns:ro
      - ./secrets/fcm:/fcm:ro
    networks: [psst]

  # Administrácia pozvánok a členov — https://<APP_DOMAIN>/admin (len cez nginx), DECISIONS D56
  admin:
    build: ./admin
    image: psst-admin:local
    restart: unless-stopped
    logging: *logging
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      MATRIX_DOMAIN: ${MATRIX_DOMAIN}
      MAS_PUBLIC_BASE: https://${AUTH_DOMAIN}${AUTH_PREFIX}
      AUTH_PREFIX: ${AUTH_PREFIX}
      ADMIN_CLIENT_ID: ${ADMIN_CLIENT_ID}
    volumes:
      - ./secrets/admin-run:/secrets:ro
      - ./data/admin:/data
    depends_on:
      - mas
    networks: [psst]

  nginx:
    image: docker.io/library/nginx:1.30.6-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      - synapse
      - mas
      - lk-jwt-service
      - livekit
      - element-call
    # Periodický reload, aby nginx načítal obnovené certifikáty od certbota.
    command: ["/bin/sh", "-c", "while :; do sleep 21600 & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./data/config/nginx-main/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/config/nginx:/etc/nginx/conf.d:ro
      - ./data/config/app-default:/srv/app-default:ro
      - ./app:/srv/app:ro
      - ./downloads:/srv/downloads:ro   # stránka na stiahnutie (D59), zapisuje len psst-dl
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      psst:
        # pevná IP: Synapse ju má v ip_range_whitelist (push brána Sygnal za nginx),
        # LiveKit jej verí PROXY protocol hlavičku (TURN/TLS)
        ipv4_address: 172.30.0.10
        # interní klienti volajú verejné domény priamo na tento nginx: lk-jwt-service (OpenID cez :8448,
        # LiveKit API), Synapse (push na Sygnal)
        aliases:
          - ${MATRIX_DOMAIN}

  certbot:
    image: docker.io/certbot/certbot:v5.10.0
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 43200 & wait $${!}; done"]
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    networks: [psst]

networks:
  psst:
    name: psst
    ipam:
      config:
        - subnet: 172.30.0.0/24
