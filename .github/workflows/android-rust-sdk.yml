# PSST: matrix-rust-sdk for psst Android with the psst patches (docs/android-search.md D80,
# docs/android-qr-verification.md D81).
#
# Builds libmatrix_sdk_ffi.so from matrix-rust-sdk at the commit of the official Kotlin release (pins.env) plus every
# scripts/android/rust-sdk/*.patch, generates the Kotlin bindings, and builds the AAR with the official
# matrix-rust-components-kotlin project at the same release tag (same Gradle setup as upstream's release). The job
# also proves that the bindings differ from the official sources jar ONLY in matrix_sdk_ffi.kt (the psst additions to
# the session verification controller); any other difference stops the release.
# Result: GitHub release "android-rust-sdk-<version>-psst<rev>" with the AAR and its SHA-256; the Android workflow
# downloads it by tag and checks the hash (forks/android libraries/rustsdk/psst-rust-sdk.properties).
name: Android Rust SDK (psst patch)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - scripts/android/rust-sdk/**
      - .github/workflows/android-rust-sdk.yml

permissions:
  contents: read

concurrency:
  group: android-rust-sdk
  cancel-in-progress: false

jobs:
  build:
    name: "libmatrix_sdk_ffi.so: ${{ matrix.target }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: true
      matrix:
        target: [ aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android ]
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - name: Checkout psst
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pins
        run: cat scripts/android/rust-sdk/pins.env | grep -E '^[A-Z_]+=' >> "$GITHUB_ENV"
      - name: Checkout matrix-rust-sdk at the pinned commit and apply the psst patch
        run: |
          git init -q rust-sdk && cd rust-sdk
          git remote add origin https://github.com/matrix-org/matrix-rust-sdk.git
          git fetch -q --depth 1 origin "$RUST_SDK_REF"
          git checkout -q FETCH_HEAD
          for p in ../scripts/android/rust-sdk/*.patch; do git apply --verbose "$p"; done
      - name: NDK
        run: |
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          [ -d "$NDK" ] || { echo "NDK $NDK_VERSION missing"; ls "$ANDROID_HOME/ndk"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "LLVM_OBJCOPY=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy" >> "$GITHUB_ENV"
      - name: Rust toolchain, cargo-ndk, protoc
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
          sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
          cargo install cargo-ndk --locked
      - name: Unit tests of the patched crates
        if: matrix.target == 'x86_64-linux-android'
        working-directory: rust-sdk
        run: |
          cargo test -p matrix-sdk-search --lib
          cargo check -p matrix-sdk-ffi
      - name: Build (small-release-stripped, as the official release)
        working-directory: rust-sdk
        env:
          RUSTFLAGS: "-Clink-args=-Wl,--build-id"
        run: |
          cargo xtask kotlin build-android-library --profile small-release-stripped \
            --only-target ${{ matrix.target }} --src-dir "$GITHUB_WORKSPACE/out/src/main" --package full-sdk
          find "$GITHUB_WORKSPACE/out/src/main/jniLibs" -type f ! -name libmatrix_sdk_ffi.so -delete
          so=$(find "$GITHUB_WORKSPACE/out/src/main/jniLibs" -name libmatrix_sdk_ffi.so)
          "$LLVM_OBJCOPY" --strip-debug --strip-unneeded "$so"
          ls -l "$so"
      - name: Upload .so
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: so-${{ matrix.target }}
          path: out/src/main/jniLibs/
          if-no-files-found: error
          retention-days: 7
      - name: Upload generated Kotlin bindings
        if: matrix.target == 'x86_64-linux-android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-bindings
          path: out/src/main/kotlin/
          if-no-files-found: error
          retention-days: 7

  aar:
    name: Patched AAR → GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout psst
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pins
        run: cat scripts/android/rust-sdk/pins.env | grep -E '^[A-Z_]+=' >> "$GITHUB_ENV"
      - name: Download .so files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: so-*
          merge-multiple: true
          path: jniLibs/
      - name: Download generated bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kotlin-bindings
          path: bindings/
      - name: Checkout matrix-rust-components-kotlin at the release tag
        run: git clone -q --depth 1 --branch "sdk-v$SDK_VERSION" https://github.com/matrix-org/matrix-rust-components-kotlin.git rck
      - name: Bindings differ from the official ones only in matrix_sdk_ffi.kt
        run: |
          set -euo pipefail
          base="https://repo1.maven.org/maven2/org/matrix/rustcomponents/sdk-android/$SDK_VERSION/sdk-android-$SDK_VERSION"
          curl -fsSL "$base-sources.jar" -o official-sources.jar
          # the official jars have overlapping duplicate entries that unzip and zipfile reject: read by local headers
          python3 scripts/android/rust-sdk/unzip-stream.py official-sources.jar official-src
          changed=""
          for f in $(cd bindings && find . -name '*.kt'); do
            diff -q "bindings/$f" "official-src/main/$f" >/dev/null || changed="$changed $f"
          done
          echo "changed bindings:$changed"
          for f in $changed; do
            case "$f" in ./org/matrix/rustcomponents/sdk/matrix_sdk_ffi.kt) ;; *) echo "unexpected change: $f"; exit 1 ;; esac
          done
          diff -u official-src/main/org/matrix/rustcomponents/sdk/matrix_sdk_ffi.kt bindings/org/matrix/rustcomponents/sdk/matrix_sdk_ffi.kt | grep -cE '^[+-]' || true
      - name: JDK 17 (as the official release)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the AAR (official Gradle project, psst .so + bindings)
        run: |
          set -euo pipefail
          main=rck/sdk/sdk-android/src/main
          mkdir -p "$main/jniLibs" "$main/kotlin"
          cp -r jniLibs/* "$main/jniLibs/"
          cp -r bindings/* "$main/kotlin/"
          find "$main/jniLibs" -type f
          (cd rck && ./gradlew --no-daemon -q :sdk:sdk-android:assembleRelease)
          name="sdk-android-$SDK_VERSION-psst$PSST_REV.aar"
          cp rck/sdk/sdk-android/build/outputs/aar/sdk-android-release.aar "$name"
          unzip -l "$name" | grep -E "jni/|classes.jar"
          sha256sum "$name" | tee "$name.sha256"
          echo "AAR=$name" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-rust-sdk-$SDK_VERSION-psst$PSST_REV"
          notes="matrix-rust-sdk $RUST_SDK_REF + scripts/android/rust-sdk/*.patch (search: diacritics folding + word prefixes; QR code device verification in the FFI), AAR built with matrix-rust-components-kotlin sdk-v$SDK_VERSION. Built by workflow run ${{ github.run_id }}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$AAR" "$AAR.sha256" --clobber
          else
            gh release create "$tag" "$AAR" "$AAR.sha256" --title "$tag" --notes "$notes" --prerelease
          fi
