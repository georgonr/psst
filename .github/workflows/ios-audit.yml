# PSST iOS feature audit (docs/FEATURE-MATRIX.md, DECISIONS D64): the psst iOS app in the simulator against
# production chat.psst.pro, driven by XCUITest (forks/ios IntegrationTests/Sources/PsstAuditTests.swift).
# The partner is Element Web on this runner (scripts/audit/ios-partner.mjs).
#
# Test accounts only: secret PSST_AUDIT_IOS_ACCOUNTS = {"a": {"user","password"}, "b": {...}} (fresh accounts,
# deactivated after the run; the secret is deleted afterwards). Never real users.
name: iOS audit

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "georgonr/psst-ios ref"
        default: psst
        required: true

permissions:
  contents: read

concurrency:
  group: ios-audit
  cancel-in-progress: true

env:
  FORK_REPO: georgonr/psst-ios
  FORK_REF: ${{ inputs.ref || 'psst' }}

jobs:
  audit:
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          path: psst
          persist-credentials: false
      - name: Checkout psst-ios
        uses: actions/checkout@v5
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ env.FORK_REF }}
          path: ios
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"; xcodebuild -version
      - name: Tools + project
        working-directory: ios
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install xcodegen
          mkdir -p "$RUNNER_TEMP/shims"
          for t in swiftlint swiftformat; do printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/shims/$t"; chmod +x "$RUNNER_TEMP/shims/$t"; done
          echo "$RUNNER_TEMP/shims" >> "$GITHUB_PATH"
          xcodegen
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm
          key: spm-${{ hashFiles('ios/project.yml') }}
          restore-keys: spm-
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          best = None
          for rt, devs in json.load(sys.stdin)["devices"].items():
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              if not m: continue
              v = (int(m.group(1)), int(m.group(2)))
              for d in devs:
                  if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"] and (best is None or v > best[0]):
                      best = (v, d["udid"])
          print(best[1] if best else "")')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
      - name: Build for testing
        working-directory: ios
        run: |
          xcodebuild build-for-testing -project ElementX.xcodeproj -scheme IntegrationTests -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -skipPackagePluginValidation -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER= DEVELOPMENT_TEAM=PSSTSIMULA > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E 'error:' "$RUNNER_TEMP/build.log" | sort -u | head -60; tail -30 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -3 "$RUNNER_TEMP/build.log"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Partner (Element Web) in the background
        env:
          ACCOUNTS: ${{ secrets.PSST_AUDIT_IOS_ACCOUNTS }}
        run: |
          [ -n "$ACCOUNTS" ] || { echo "::error::secret PSST_AUDIT_IOS_ACCOUNTS missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/partner" "$RUNNER_TEMP/out"
          printf '%s' "$ACCOUNTS" > "$RUNNER_TEMP/partner/accounts.json"
          cp psst/scripts/audit/ios-partner.mjs "$RUNNER_TEMP/partner/"
          cd "$RUNNER_TEMP/partner" && npm init -y >/dev/null && npm i playwright@1.64.1 >/dev/null && npx playwright install chromium >/dev/null
          nohup node ios-partner.mjs "$RUNNER_TEMP/out" accounts.json > "$RUNNER_TEMP/out/partner.log" 2>&1 &
          for i in $(seq 1 90); do grep -q "signed in" "$RUNNER_TEMP/out/partner.log" && break; sleep 2; done
          cat "$RUNNER_TEMP/out/partner.log"
          python3 -c "import json;d=json.load(open('accounts.json'));print('PARTNER=@%s:psst.pro' % d['b']['user']);print('IOS_USER=%s' % d['a']['user'])" >> "$GITHUB_ENV"
          python3 -c "import json;d=json.load(open('accounts.json'));print(d['a']['password'])" > "$RUNNER_TEMP/partner/ios.pw"
      - name: Run PsstAuditTests
        working-directory: ios
        run: |
          export TEST_RUNNER_INTEGRATION_TESTS_USERNAME="$IOS_USER"
          export TEST_RUNNER_INTEGRATION_TESTS_PASSWORD="$(cat "$RUNNER_TEMP/partner/ios.pw")"
          export TEST_RUNNER_PSST_AUDIT_PARTNER="$PARTNER"
          xcodebuild test-without-building -project ElementX.xcodeproj -scheme IntegrationTests \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -only-testing:IntegrationTests/PsstAuditTests \
            -resultBundlePath "$RUNNER_TEMP/out/audit.xcresult" 2>&1 | tee "$RUNNER_TEMP/out/test.log" | grep -E "PSST-AUDIT|error|Test Case|passed|failed" || true
          grep "PSST-AUDIT|" "$RUNNER_TEMP/out/test.log" | sed 's/.*PSST-AUDIT|/PSST-AUDIT|/' | sort -u > "$RUNNER_TEMP/out/ios-result.txt" || true
          { echo "### iOS audit"; echo; echo '| id | status | note |'; echo '|---|---|---|';
            awk -F'|' '{print "| "$2" | "$3" | "$4" |"}' "$RUNNER_TEMP/out/ios-result.txt"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Partner result
        if: always()
        run: |
          sleep 20; cat "$RUNNER_TEMP/out/partner.log" | tail -60; pkill -f ios-partner.mjs || true
          rm -f "$RUNNER_TEMP/partner/ios.pw" "$RUNNER_TEMP/partner/accounts.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psst-ios-audit
          path: |
            ${{ runner.temp }}/out/
          if-no-files-found: ignore
          retention-days: 14
