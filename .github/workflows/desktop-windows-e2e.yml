# PSST Windows desktop — install the MSI and test it end-to-end against production (D60).
# Uses the MSI of a "Web + Desktop" run (default: the latest successful one on main) and the test accounts in the
# secret PSST_E2E_ACCOUNTS — fresh accounts per run: scripts/desktop/e2e-accounts.sh create (then cleanup).
name: Desktop Windows E2E
on:
    workflow_dispatch:
        inputs:
            run_id:
                description: "Web + Desktop run id with the MSI (empty = latest successful)"
                required: false
permissions:
    contents: read
    actions: read
jobs:
    e2e:
        runs-on: windows-latest
        timeout-minutes: 60
        defaults:
            run:
                shell: pwsh
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Download MSI
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  $run = "${{ inputs.run_id }}"
                  if (-not $run) { $run = gh run list -R $env:GITHUB_REPOSITORY --workflow web-desktop.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId' }
                  gh run download $run -R $env:GITHUB_REPOSITORY -n psst-desktop-windows -D dl
                  $msi = Get-ChildItem dl -Recurse -Filter *.msi | Select-Object -First 1
                  $msi.Name -match '-b(\d+)\.msi$' | Out-Null
                  "MSI=$($msi.FullName)" >> $env:GITHUB_ENV; "BUILD=$($Matches[1])" >> $env:GITHUB_ENV
                  "Testing $($msi.Name) from run $run" >> $env:GITHUB_STEP_SUMMARY
            - name: Install MSI (silent)
              run: |
                  $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$env:MSI`"", '/qn', '/l*v', "$env:RUNNER_TEMP\install.log" -Wait -PassThru
                  if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 50; throw "msiexec exit $($p.ExitCode)" }
                  $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "${env:ProgramFiles(x86)}" -Recurse -Filter psst.exe -ErrorAction SilentlyContinue | Select-Object -First 1
                  if (-not $exe) { throw "psst.exe not found after install" }
                  "EXE=$($exe.FullName)" >> $env:GITHUB_ENV
                  "Installed to $($exe.FullName) ($([math]::Round($exe.Length/1MB)) MB)" >> $env:GITHUB_STEP_SUMMARY
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - name: Playwright
              run: |
                  New-Item -ItemType Directory e2e | Out-Null
                  Copy-Item scripts/desktop/windows-e2e.mjs e2e/
                  Set-Location e2e; npm init -y | Out-Null; npm i playwright@1.64.1 | Out-Null; npx playwright install chromium | Out-Null
            - name: Run E2E
              env:
                  ACCOUNTS: ${{ secrets.PSST_E2E_ACCOUNTS }}
              run: |
                  if (-not $env:ACCOUNTS) { throw "secret PSST_E2E_ACCOUNTS missing" }
                  $env:ACCOUNTS | Out-File -Encoding utf8NoBOM "$env:RUNNER_TEMP\acc.json"
                  Set-Location e2e
                  node windows-e2e.mjs "$env:EXE" "$env:GITHUB_WORKSPACE\e2e-results" "$env:RUNNER_TEMP\acc.json" "$env:BUILD"
                  $code = $LASTEXITCODE
                  Remove-Item "$env:RUNNER_TEMP\acc.json"
                  exit $code
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: psst-windows-e2e
                  path: e2e-results/
                  retention-days: 14
