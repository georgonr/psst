# PSST (L1): psst lab (eu.macet.psst.lab) — the separate iOS test app with LoRa / Meshtastic, fork branch lab/meshtastic.
# Never touches the psst release (eu.macet.psst, workflow ios-release.yml, version 26.11.x builds).
#
# Runs on a push to this branch when lab/ios-lab-build.json changes (workflow_dispatch only works for workflows on the
# default branch, and the lab must stay off main). That file says what to do:
#   {"ref": "<psst-ios ref>", "mode": "check" | "release", "build_number": N, "upload": true|false}
#   check    PsstLab package tests (swift test), iOS compile of the package, unsigned simulator build of the app
#   release  the same checks, then archive + sign (Apple Distribution, profile from IOS_LAB_PROVISIONING_PROFILES_BASE64)
#            + public-Xcode gate (D90) + optional TestFlight upload (altool). Distribution to the internal group
#            "psst" happens afterwards via scripts/ios/lab-testflight.sh (App Store Connect API).
# Secrets: IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD, APPLE_TEAM_ID (same as ios-release.yml),
#          IOS_LAB_PROVISIONING_PROFILES_BASE64 (App Store profile for eu.macet.psst.lab), APP_STORE_CONNECT_* for upload.
name: iOS psst lab

on:
  push:
    branches: [lab/meshtastic]
    paths: [lab/ios-lab-build.json]

permissions:
  contents: read

concurrency:
  group: ios-lab
  cancel-in-progress: false

env:
  FORK_REPO: georgonr/psst-ios
  BUNDLE_ID: eu.macet.psst.lab

jobs:
  lab:
    name: psst lab ${{ github.sha }}
    runs-on: xcode-27
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          path: psst
          persist-credentials: false

      - name: Read lab/ios-lab-build.json
        id: cfg
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open("psst/lab/ios-lab-build.json"))
          assert c["mode"] in ("check", "release"), c
          print(f"ref={c['ref']}\nmode={c['mode']}\nbuild_number={int(c.get('build_number', 0))}\nupload={str(bool(c.get('upload', False))).lower()}")
          PY
          cat psst/lab/ios-lab-build.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ steps.cfg.outputs.ref }}
          path: ios
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false

      - name: Select public (GM) Xcode (D90)
        run: |
          psst/scripts/ios/select-xcode.sh psst/ci/ios-public-xcode.json
          xcodebuild -version

      - name: PsstLab package — unit tests (crypto, chunking, framing, client, BLE session)
        working-directory: ios/Components/PsstLab
        run: |
          swift test 2>&1 | tee "$RUNNER_TEMP/package-tests.log" | grep -E "✘|✔ Test run|Test run with|error:" || true
          grep -q "Test run with .* passed" "$RUNNER_TEMP/package-tests.log"
          grep -E "Test run with" "$RUNNER_TEMP/package-tests.log" >> "$GITHUB_STEP_SUMMARY"

      - name: PsstLab package — compile for iOS (CoreBluetooth, SwiftUI, QR scanner)
        working-directory: ios/Components/PsstLab
        run: |
          xcodebuild build -scheme PsstLabUI -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd-pkg" \
            -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/pkg-ios.log" 2>&1 && rc=0 || rc=$?
          grep -E "error:|warning: .*PsstLab" "$RUNNER_TEMP/pkg-ios.log" | grep -v MeshtasticProtobufs | sort -u | head -60 || true
          tail -3 "$RUNNER_TEMP/pkg-ios.log"
          exit $rc

      - name: Tools + project
        working-directory: ios
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install xcodegen
          mkdir -p "$RUNNER_TEMP/shims"
          for t in swiftlint swiftformat; do printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/shims/$t"; chmod +x "$RUNNER_TEMP/shims/$t"; done
          echo "$RUNNER_TEMP/shims" >> "$GITHUB_PATH"
          grep -q "BASE_BUNDLE_IDENTIFIER: $BUNDLE_ID$" app.yml || { echo "::error::app.yml is not the psst lab variant"; exit 1; }

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm
          key: spm-lab-${{ hashFiles('ios/project.yml', 'ios/Components/PsstLab/Package.swift') }}
          restore-keys: spm-

      - name: App — simulator build (unsigned, Debug)
        if: steps.cfg.outputs.mode == 'check'
        working-directory: ios
        run: |
          xcodegen
          xcodebuild build -project ElementX.xcodeproj -scheme ElementX -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO ARCHS=arm64 > "$RUNNER_TEMP/sim.log" 2>&1 &
          pid=$!
          while kill -0 $pid 2>/dev/null; do sleep 60; echo "[$(date +%T)] $(tail -1 "$RUNNER_TEMP/sim.log" | cut -c1-160)"; done
          wait $pid && rc=0 || rc=$?
          grep -E "error:" "$RUNNER_TEMP/sim.log" | sort -u | head -80 || true
          tail -3 "$RUNNER_TEMP/sim.log"
          [ $rc -eq 0 ] || exit $rc
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/ElementX.app"
          for k in CFBundleIdentifier CFBundleDisplayName NSBluetoothAlwaysUsageDescription; do
            echo "$k = $(/usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$BUNDLE_ID" ]
          ! /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist" | grep -qx ' *location'
          ls "$APP/PlugIns" 2>/dev/null && { echo "::error::psst lab must not embed extensions"; exit 1; } || true

      - name: Signing certificate + profile
        if: steps.cfg.outputs.mode == 'release'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILES_BASE64: ${{ secrets.IOS_LAB_PROVISIONING_PROFILES_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in P12_BASE64 P12_PASSWORD PROFILES_BASE64 APPLE_TEAM_ID; do [ -n "${!v}" ] || { echo "::error::secret for $v missing"; exit 1; }; done
          KEYCHAIN="$RUNNER_TEMP/psst-lab.keychain-db"; KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/profiles" ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILES_BASE64" | base64 --decode > "$RUNNER_TEMP/profiles.zip"
          unzip -jq "$RUNNER_TEMP/profiles.zip" '*.mobileprovision' -d "$RUNNER_TEMP/profiles"
          for p in "$RUNNER_TEMP"/profiles/*.mobileprovision; do
            security cms -D -i "$p" > "$RUNNER_TEMP/p.plist"
            APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/p.plist")
            [ "${APPID#*.}" = "$BUNDLE_ID" ] || continue
            UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/p.plist")
            NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/p.plist")
            cp "$p" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
            echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
            echo "profile '$NAME' ($UUID) → $BUNDLE_ID"
          done
          grep -q PROFILE_NAME "$GITHUB_ENV" || { echo "::error::no profile for $BUNDLE_ID"; exit 1; }

      - name: Archive (Release, signed)
        if: steps.cfg.outputs.mode == 'release'
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ steps.cfg.outputs.build_number }}
        run: |
          [ "$BUILD_NUMBER" -gt 0 ] || { echo "::error::build_number must be > 0"; exit 1; }
          echo "PSST_BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          printf 'targets:\n  ElementX:\n    settings:\n      base:\n        PROVISIONING_PROFILE_SPECIFIER: "%s"\n' "$PROFILE_NAME" > psst-signing.yml
          python3 - <<'PY'
          import os, re
          s = open("project.yml").read()
          s = s.replace("include:\n", "include:\n- path: psst-signing.yml\n", 1)
          s = re.sub(r"CURRENT_PROJECT_VERSION: \d+", "CURRENT_PROJECT_VERSION: " + os.environ["BUILD_NUMBER"], s)
          open("project.yml", "w").write(s)
          PY
          xcodegen
          D=$(date -u +%Y-%m-%d)
          xcodebuild archive -project ElementX.xcodeproj -scheme ElementX -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/lab.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -skipPackagePluginValidation -skipMacroValidation \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PSST_BUILD_DATE="$D" OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" COMPILER_INDEX_STORE_ENABLE=NO \
            > "$RUNNER_TEMP/archive.log" 2>&1 &
          pid=$!
          while kill -0 $pid 2>/dev/null; do sleep 60; echo "[$(date +%T)] $(tail -1 "$RUNNER_TEMP/archive.log" | cut -c1-160)"; done
          wait $pid && rc=0 || rc=$?
          grep -E 'error:' "$RUNNER_TEMP/archive.log" | sort -u | head -100 || true
          tail -5 "$RUNNER_TEMP/archive.log"
          exit $rc

      - name: Export IPA + checks
        if: steps.cfg.outputs.mode == 'release'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ steps.cfg.outputs.build_number }}
        run: |
          python3 - <<'PY'
          import os, plistlib
          opts = {"method": "app-store-connect", "teamID": os.environ["APPLE_TEAM_ID"], "signingStyle": "manual",
                  "signingCertificate": "Apple Distribution",
                  "provisioningProfiles": {os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"]},
                  "uploadSymbols": True, "manageAppVersionAndBuildNumber": False}
          plistlib.dump(opts, open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb"))
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/lab.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          mv "$IPA" "$RUNNER_TEMP/export/psst-lab.ipa"
          cp "$RUNNER_TEMP/export/psst-lab.ipa" "$RUNNER_TEMP/export/psst-lab-ios-$PSST_BUILD_DATE-b$BUILD_NUMBER.ipa"
          python3 psst/scripts/ios/check-ipa-xcode.py "$RUNNER_TEMP/export/psst-lab.ipa" psst/ci/ios-public-xcode.json | tee -a "$GITHUB_STEP_SUMMARY"
          cd "$RUNNER_TEMP" && rm -rf ipa && mkdir ipa && cd ipa && unzip -q ../export/psst-lab.ipa
          APP=$(ls -d Payload/*.app)
          for k in CFBundleIdentifier CFBundleDisplayName CFBundleShortVersionString CFBundleVersion; do
            echo "$k = $(/usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          codesign -d --entitlements :- "$APP" 2>/dev/null | tee "$RUNNER_TEMP/ent.plist" | grep -E "<key>" | tee -a "$GITHUB_STEP_SUMMARY"
          ! grep -q "application-groups\|aps-environment" "$RUNNER_TEMP/ent.plist" || { echo "::error::psst lab must not have an App Group or push"; exit 1; }
          [ ! -d "$APP/PlugIns" ] || { echo "::error::psst lab must not embed extensions"; exit 1; }

      - name: Upload to TestFlight
        if: steps.cfg.outputs.mode == 'release' && steps.cfg.outputs.upload == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/export/psst-lab.ipa" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.mode == 'release'
        with:
          name: psst-lab-ipa
          path: ${{ runner.temp }}/export/psst-lab-ios-*.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psst-lab-logs
          path: |
            ${{ runner.temp }}/package-tests.log
            ${{ runner.temp }}/pkg-ios.log
            ${{ runner.temp }}/sim.log
            ${{ runner.temp }}/archive.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up keychain
        if: always()
        run: |
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -rf ~/.appstoreconnect ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision
